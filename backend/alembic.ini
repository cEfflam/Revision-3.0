# Configuration Alembic (migrations de schéma).
# L'URL de la base n'est PAS ici : elle est injectée par env.py depuis la
# variable DATABASE_URL, pour ne jamais avoir de mot de passe dans un fichier
# versionné.

[alembic]
script_location = alembic
prepend_sys_path = .
# Les fichiers de migration sont datés : l'ordre chronologique se lit au nom.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
